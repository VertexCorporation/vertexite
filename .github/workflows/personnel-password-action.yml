name: Personnel password action
on:
  pull_request:
    paths:
      - actions.html
      - tests/personnel-password-action.test.cjs
      - .github/workflows/personnel-password-action.yml
  push:
    branches: [main]
    paths:
      - actions.html
      - tests/personnel-password-action.test.cjs
      - .github/workflows/personnel-password-action.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test tests/personnel-password-action.test.cjs
