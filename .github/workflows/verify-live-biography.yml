name: Verify live biography skyline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-live-biography.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify live HTML, JS and CSS served by vertexishere.com
        shell: bash
        run: |
          set -euo pipefail
          host="https://vertexishere.com"
          fetch() { curl -fLsS --compressed --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 2 "$1"; }
          echo "Checking deployed files on $host"
          found=0
          for attempt in {1..9}; do
            if fetch "$host/js/site-design.js?skyline-check=$GITHUB_SHA" > /tmp/live-site-design.js &&
               fetch "$host/css/pages/profile-photo-fog.css?skyline-check=$GITHUB_SHA" > /tmp/live-fog.css &&
               grep -Fq 'mobileHeights=[182,232,205,227,192,221]' /tmp/live-site-design.js &&
               grep -Fq '.profile-skyline .city-buildings-mobile{display:inline}' /tmp/live-fog.css; then
              found=1
              echo "Live six-building skyline and responsive CSS confirmed."
              break
            fi
            echo "Attempt $attempt: live assets not yet current; retrying."
            sleep 15
          done
          if [[ "$found" != 1 ]]; then
            echo "::error::Live skyline assets could not be confirmed on $host"
            exit 1
          fi
          # Managed biographies now render public text at the edge instead of
          # redirecting Google to a noindex client-only shell.
          ready=0
          for attempt in {1..20}; do
            if fetch "$host/tr/mustafa" > /tmp/live-biography.html && grep -Fq 'data-server-rendered="true"' /tmp/live-biography.html; then
              ready=1
              break
            fi
            sleep 12
          done
          [[ "$ready" == 1 ]]
          langs=(ar az de en es fr hi id it ja ko nl pt ru tr zh)
          for lang in "${langs[@]}"; do
            fetch "$host/$lang/mustafa" > /tmp/live-biography.html
            grep -Fq 'data-server-rendered="true"' /tmp/live-biography.html
            grep -Fq 'index,follow,max-image-preview:large' /tmp/live-biography.html
            grep -Fq 'application/ld+json' /tmp/live-biography.html
            grep -Fq "https://vertexishere.com/$lang/mustafa" /tmp/live-biography.html
            echo "PASS $lang: public biography HTML, canonical and Person markup"
          done
