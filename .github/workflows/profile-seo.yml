name: Profile SEO and live Lighthouse
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['assets/fonts/**', 'performance-pages.json', 'sitemap.xml', 'scripts/public-page-inventory.cjs', '**/index.html', '**/beacon.html', 'js/site-design.js', 'js/intro.js', 'js/hero-scene.js', '_worker.js', 'css/site-design.css', 'tests/theme-contrast.test.cjs', '_routes.json', 'robots.txt', 'js/team-profile.js', 'js/profile-scene.js', '**/profile.html', 'tests/profile-seo.test.cjs', '.github/workflows/profile-seo.yml']
  pull_request:
    paths: ['assets/fonts/**', 'performance-pages.json', 'sitemap.xml', 'scripts/public-page-inventory.cjs', '**/index.html', '**/beacon.html', 'js/site-design.js', 'js/intro.js', 'js/hero-scene.js', '_worker.js', 'css/site-design.css', 'tests/theme-contrast.test.cjs', '_routes.json', 'robots.txt', 'js/team-profile.js', 'js/profile-scene.js', '**/profile.html', 'tests/profile-seo.test.cjs', '.github/workflows/profile-seo.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run test:seo
      - run: node scripts/build-sitemap.cjs --check
      - run: node scripts/version-design-css.cjs --check
  live-audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the production-rendered biography
        shell: bash
        run: |
          set -euo pipefail
          design_version=$(sha256sum css/site-design.css | cut -c1-12)
          font_version=$(sha256sum assets/fonts/fonts.css | cut -c1-12)
          ready=0
          for attempt in {1..20}; do
            if curl -fsS --max-time 25 https://vertexishere.com/tr/mustafa > /tmp/profile.html && grep -q 'data-server-rendered="true"' /tmp/profile.html &&
               curl -fsS --compressed --max-time 25 https://vertexishere.com/js/hero-scene.js > /tmp/live-hero.js && cmp -s js/hero-scene.js /tmp/live-hero.js &&
               curl -fsS --compressed --max-time 25 'https://vertexishere.com/js/site-design.js?v=mobile261029' > /tmp/live-design.js && cmp -s js/site-design.js /tmp/live-design.js &&
               curl -fsS --max-time 25 https://vertexishere.com/tr/ > /tmp/live-home.html && grep -Fq "site-design.css?v=$design_version" /tmp/live-home.html && grep -Fq "fonts.css?v=$font_version" /tmp/live-home.html; then
              ready=1
              break
            fi
            sleep 12
          done
          [[ "$ready" == 1 ]]
          grep -q 'index,follow,max-image-preview:large' /tmp/profile.html
          curl -fsS --max-time 25 https://vertexishere.com/sitemap-profiles.xml > /tmp/profiles.xml
          grep -q 'https://vertexishere.com/tr/mustafa' /tmp/profiles.xml
      - name: Measure all public page classes on mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-results
          while IFS=$'\t' read -r page path; do
            url="https://vertexishere.com$path"
            for mode in mobile desktop; do
              args=()
              [[ "$mode" != desktop ]] || args+=(--preset=desktop)
              [[ "$page/$mode" != homepage/mobile ]] || args+=(--save-assets)
              npm exec --yes --package=lighthouse@13.6.0 -- lighthouse "$url" "${args[@]}" --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="lighthouse-results/$page-$mode.json" --quiet
            done
          done < <(node -e 'for(const p of require("./performance-pages.json").pages)console.log(p.name+"\t"+p.path)')
          node scripts/summarize-lighthouse.cjs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-lighthouse
          path: lighthouse-results
